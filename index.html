<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZPRO QR Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top right, #163b24, transparent 40%),
        radial-gradient(circle at bottom left, #102b38, transparent 40%),
        #070a0e;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(25px);
    border-radius: 28px;
    padding: 25px;
    box-shadow: 0 0 50px rgba(0,255,100,0.08);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 15px;
    border-radius: 22px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.35);
    box-shadow: 0 0 25px rgba(0,255,136,0.2);
    transition: 0.3s;
}

.logo:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(0,255,136,0.4);
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 5px;
    display: block;
}

h1 {
    font-size: 25px;
    font-weight: 900;
}

h1 span {
    color: #00ff88;
}

.subtitle {
    color: #8e9ba8;
    font-size: 13px;
    margin-top: 8px;
}

label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    color: #cbd5e1;
}

textarea {
    width: 100%;
    height: 125px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 15px;
    color: white;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    resize: vertical;
    transition: 0.3s;
}

textarea:focus {
    border-color: #00ff88;
    box-shadow: 0 0 15px rgba(0,255,136,0.1);
}

.controls {
    display: flex;
    gap: 12px;
    margin-top: 15px;
}

select {
    flex: 1;
    background: #111820;
    color: white;
    border: 1px solid #263340;
    border-radius: 12px;
    padding: 12px;
    font-family: inherit;
    outline: none;
}

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    transition: 0.25s;
}

.generate {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border-radius: 14px;
    background: linear-gradient(135deg, #00ff88, #00d5a0);
    color: #00180c;
    font-size: 15px;
}

.generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,255,136,0.2);
}

.qr-box {
    display: none;
    margin-top: 25px;
    padding: 20px;
    border-radius: 22px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    text-align: center;
}

.qr-box h3 {
    margin-bottom: 15px;
    font-size: 15px;
}

#qrcode {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    background: white;
    padding: 15px;
    border-radius: 15px;
    min-width: 180px;
    min-height: 180px;
}

#qrcode img {
    display: block;
    max-width: 100%;
}

#qrcode canvas {
    display: block;
    max-width: 100%;
}

.download {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border-radius: 14px;
    background: #18242d;
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.2);
}

.download:hover {
    background: #20332b;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #53616e;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            <img src="https://imgz.co/images/2026/11/02/1000068030fe6aff7afa323399.png" alt="EZPRO QR Logo">
        </div>

        <h1>EZPRO <span>QR</span></h1>

        <p class="subtitle">تبدیل هر چیزی به QR Code حرفه‌ای</p>

    </div>

    <label for="text">متن یا لینک خود را وارد کنید</label>

    <textarea id="text" placeholder="مثلاً:
https://google.com

یا هر متن دیگری..."></textarea>

    <div class="controls">
        <select id="size">
            <option value="200">اندازه 200 × 200</option>
            <option value="300" selected>اندازه 300 × 300</option>
            <option value="500">اندازه 500 × 500</option>
            <option value="800">اندازه 800 × 800</option>
        </select>
    </div>

    <button class="generate" onclick="generateQR()">
        ⚡ ساخت QR CODE
    </button>

    <div class="qr-box" id="qrBox">
        <h3>✨ QR CODE شما آماده است</h3>

        <div id="qrcode"></div>

        <button class="download" onclick="downloadQR()">
            📥 دانلود QR با کیفیت بالا
        </button>
    </div>

    <div class="footer">
        EZPRO QR SYSTEM • POWERED BY EZPRO
    </div>

</div>

<script>
let qrInstance = null;

function generateQR() {
    const text = document.getElementById("text").value.trim();
    const size = parseInt(document.getElementById("size").value);
    const qrBox = document.getElementById("qrBox");
    const qrContainer = document.getElementById("qrcode");

    if (!text) {
        alert("لطفاً ابتدا متن یا لینک وارد کنید!");
        return;
    }

    qrContainer.innerHTML = "";
    qrBox.style.display = "block";

    qrInstance = new QRCode(qrContainer, {
        text: text,
        width: size,
        height: size,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });
}

function downloadQR() {
    const qrContainer = document.getElementById("qrcode");
    const canvas = qrContainer.querySelector("canvas");
    const img = qrContainer.querySelector("img");

    let imageURL;

    if (canvas) {
        imageURL = canvas.toDataURL("image/png");
    } else if (img) {
        imageURL = img.src;
    } else {
        alert("ابتدا QR CODE بسازید!");
        return;
    }

    const link = document.createElement("a");
    link.href = imageURL;
    link.download = "EZPRO-QR.png";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>

</body>
</html>
